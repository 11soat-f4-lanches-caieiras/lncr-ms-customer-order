spring:
  application:
    name: customerOrder
  server:
    port: "${SERVER_PORT:8080}"
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  datasource:
    url: "${POSTGRES_URL}"
    username: "${POSTGRES_USER}"
    password: "${POSTGRES_PASSWORD}"
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
      show-sql: true
      format_sql: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
lncr:
  internalUrl: "${LNCR_ALB_URL:http://localhost:8080}"
  externalUrl: "${LNCR_EXTERNAL_URL}"
  integration:
    customersUrl: "${lncr.internalUrl}/customers"
    customerOrdersUrl: "${lncr.internalUrl}/customerOrders"
    foodItemsUrl: "${lncr.internalUrl}/foodItems"
    kitchenOrdersUrl: "${lncr.internalUrl}/kitchenOrders"
    paymentsUrl: "${lncr.internalUrl}/payments"
    notificationUrl: "${lncr.internalUrl}/notifications"
  customer-order:
    location-prefix: "${lncr.internalUrl}/customerOrders"


